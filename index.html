<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAV MEATGROUP</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:white;
  color:#111;
}

/* HEADER */
header {
  display:flex;
  align-items:center;
  padding:40px 80px;
  border-bottom:1px solid #eee;
}

.logo {
  display:flex;
  align-items:center;
  gap:25px;
}

.logo img {
  width:240px; /* GROTER */
}

.logo-text {
  display:flex;
  flex-direction:column;
}

.logo-text .main {
  font-size:28px; /* GROTER */
  font-weight:800;
  color:#7A0000;
}

.logo-text .sub {
  font-size:16px;
  color:#777;
}

/* HERO */
.hero {
  padding:120px 80px;
}

.hero h2 {
  font-size:56px;
  margin-bottom:20px;
  max-width:800px;
}

.hero p {
  font-size:20px;
  color:#555;
  max-width:600px;
}

/* BUTTON */
.btn {
  background:#7A0000;
  padding:18px 35px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:40px;
  border-radius:8px;
  font-weight:700;
}

.btn:hover {
  background:#5D0000;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="arav-logo.jpg" alt="logo">
    <div class="logo-text">
      <div class="main">Premium Poultry & Meat Supplier</div>
      <div class="sub">Fresh Quality & Trust</div>
    </div>
  </div>
</header>

<section class="hero">
  <h2>Betrouwbare leverancier van kip en kalkoen voor horeca en groothandel</h2>
  <p>Snelle levering, scherpe prijzen en constante kwaliteit voor jouw business.</p>
  <a class="btn" href="#">Vraag direct prijs aan</a>
</section>

</body>
</html>
