<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAV MEATGROUP</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:white;
  color:#111;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 60px;
  border-bottom:1px solid #eee;
}

.logo {
  display:flex;
  align-items:center;
  gap:20px;
}

.logo img {
  width:130px;
}

/* MERK NAAM */
.logo h1 {
  margin:0;
  font-family:'Montserrat', sans-serif;
  font-size:24px;
  font-weight:800;
  letter-spacing:2px;

  /* KLEUR EFFECT */
  background: linear-gradient(90deg, #7A0000, #D4AF37);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* HERO */
.hero {
  padding:100px 60px;
}

.hero h2 {
  font-size:48px;
  margin-bottom:20px;
  font-family:'Montserrat', sans-serif;
}

.hero p {
  font-size:18px;
  color:#555;
}

/* BUTTON */
.btn {
  background:#7A0000;
  padding:15px 30px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:30px;
  border-radius:6px;
  font-weight:700;
}

.btn:hover {
  background:#5D0000;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="arav-logo.jpg" alt="logo">
    <h1>ARAV MEATGROUP</h1>
  </div>
</header>

<section class="hero">
  <h2>Betrouwbare leverancier van kip en kalkoen</h2>
  <p>Voor horeca, groothandel en retail. Snelle levering en scherpe prijzen.</p>
  <a class="btn" href="#">Vraag direct prijs aan</a>
</section>

</body>
</html>
