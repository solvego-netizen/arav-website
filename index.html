<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAV MEATGROUP</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:white;
  color:#111;
}

/* HEADER */
header {
  padding:30px 60px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.logo img {
  width:160px;
}

.subtext {
  margin-top:10px;
  font-size:18px;
  color:#7A0000;
  font-weight:600;
}

.tagline {
  font-size:14px;
  color:#777;
  margin-top:5px;
}

/* HERO */
.hero {
  padding:100px 60px;
  text-align:center;
}

.hero h2 {
  font-size:46px;
  margin-bottom:20px;
}

.hero p {
  font-size:18px;
  color:#555;
}

/* BUTTON */
.btn {
  background:#7A0000;
  padding:15px 30px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:30px;
  border-radius:6px;
  font-weight:700;
}

.btn:hover {
  background:#5D0000;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="arav-logo.jpg" alt="logo">
  </div>
  <div class="subtext">Premium Poultry & Meat Supplier</div>
  <div class="tagline">Fresh Quality & Trust</div>
</header>

<section class="hero">
  <h2>Betrouwbare leverancier van kip en kalkoen</h2>
  <p>Voor horeca, groothandel en retail. Snelle levering en scherpe prijzen.</p>
  <a class="btn" href="#">Vraag direct prijs aan</a>
</section>

</body>
</html>
