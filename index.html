<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAV MEATGROUP</title>

<style>
body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#0F0F0F;
  color:white;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 60px;
  border-bottom:1px solid #222;
}

.logo {
  display:flex;
  align-items:center;
  gap:20px;
}

.logo img {
  width:140px;
  height:auto;
}

.logo h1 {
  margin:0;
  font-size:22px;
  letter-spacing:2px;
  font-weight:900;
}

/* HERO */
.hero {
  padding:100px 60px;
}

.hero h2 {
  font-size:48px;
  margin-bottom:20px;
}

.hero p {
  font-size:18px;
  color:#ccc;
}

/* BUTTON */
.btn {
  background:#7A0000;
  padding:15px 30px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:30px;
  border-radius:6px;
  font-weight:700;
}

.btn:hover {
  background:#5D0000;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="arav-logo.jpg" alt="logo">
    <h1>ARAV MEATGROUP</h1>
  </div>
</header>

<section class="hero">
  <h2>Betrouwbare leverancier van kip en kalkoen</h2>
  <p>Voor horeca, groothandel en retail. Snelle levering en scherpe prijzen.</p>
  <a class="btn" href="#">Vraag direct prijs aan</a>
</section>

</body>
</html>
