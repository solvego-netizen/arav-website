<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAV MEATGROUP</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:white;
  color:#111;
}

/* HEADER */
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:30px 60px;
  border-bottom:1px solid #eee;
}

.logo {
  display:flex;
  align-items:center;
  gap:20px;
}

.logo img {
  width:180px;
}

.logo-text {
  display:flex;
  flex-direction:column;
}

.logo-text .main {
  font-size:22px;
  font-weight:800;
  color:#7A0000;
}

.logo-text .sub {
  font-size:14px;
  color:#777;
}

/* HERO */
.hero {
  padding:100px 60px;
}

.hero h2 {
  font-size:48px;
  margin-bottom:20px;
}

.hero p {
  font-size:18px;
  color:#555;
}

/* BUTTON */
.btn {
  background:#7A0000;
  padding:15px 30px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:30px;
  border-radius:6px;
  font-weight:700;
}

.btn:hover {
  background:#5D0000;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="arav-logo.jpg" alt="logo">
    <div class="logo-text">
      <div class="main">Premium Poultry & Meat Supplier</div>
      <div class="sub">Fresh Quality & Trust</div>
    </div>
  </div>
</header>

<section class="hero">
  <h2>Betrouwbare leverancier van kip en kalkoen</h2>
  <p>Voor horeca, groothandel en retail. Snelle levering en scherpe prijzen.</p>
  <a class="btn" href="#">Vraag direct prijs aan</a>
</section>

</body>
</html>
